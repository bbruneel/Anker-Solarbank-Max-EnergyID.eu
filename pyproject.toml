[project]
name = "anker-solarbank-energyid"
version = "0.1.0"
description = "Read Anker SOLIX Solarbank Max AC data over local Modbus TCP and POST it to EnergyID.eu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.21.0",
    "loguru>=0.7.3",
    "pymodbus>=3.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "flake8>=7.0.0",
    "isort>=7.0.0,<9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[project.scripts]
energyid-solarbank-monitor = "energyid_monitor.__main__:main"

[tool.setuptools]
packages = { find = { where = ["src"], exclude = ["dbscripts*"] } }

[tool.setuptools.package-data]
energyid_monitor = ["devices/*.yaml"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py311"]
line-length = 88

# Keep multidict on the patched 6.x line (GHSA-54p9-h82j-f925) without taking the 7.x major.
[tool.uv]
constraint-dependencies = [
    "multidict>=6.9.1,<7",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
